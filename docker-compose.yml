version: '3.8'

services:
  web:
    build:
      context: .
      target: dev
    container_name: commanddeck-dev
    ports:
      - "3008:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
